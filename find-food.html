<!doctype html>
<html lang="en" data-root=".">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Local Food · Chaffee Provides</title>
<meta name="description" content="Map and directory of Chaffee County farms, ranches, markets, restaurants and food assistance — filter by product, town and what's open this month.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="find-food.html">
<div id="site-header"></div>
<main id="main" class="finder" data-view="list">
  <aside aria-label="Filters and results">
    <div class="filters">
      <h1 style="font-size:1.6rem;margin:0">Find local food</h1>
      <label class="sr-only" for="q">Search</label>
      <input type="search" id="q" placeholder="Search a farm, product or town…" autocomplete="off">
      <div class="chips" id="types" role="group" aria-label="Provider type"></div>
      <div class="chips" id="offerings" role="group" aria-label="Product"></div>
      <div class="row">
        <label for="town" class="sr-only">Town</label>
        <select id="town" style="flex:1"><option value="">All towns</option></select>
      </div>
      <div class="row">
        <label><input type="checkbox" id="open"> Open in <span id="monthName"></span></label>
        <label><input type="checkbox" id="snap"> Accepts SNAP</label>
      </div>
      <div class="mobile-toggle" role="group" aria-label="View">
        <button class="chip" data-view="list" aria-pressed="true">☰ List</button>
        <button class="chip" data-view="map" aria-pressed="false">🗺️ Map</button>
      </div>
    </div>
    <div class="count"><span id="count" aria-live="polite"></span><button id="reset" class="chip" style="padding:2px 10px">Reset</button></div>
    <div class="list" id="list"></div>
  </aside>
  <div class="mapbox"><div id="map" role="region" aria-label="Map of providers"></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  "use strict";
  var esc = CP.esc;
  var state = { q:"", type:"", offering:"", town:"", open:false, snap:false };
  var els = { q:document.getElementById("q"), types:document.getElementById("types"), offerings:document.getElementById("offerings"),
    town:document.getElementById("town"), open:document.getElementById("open"), snap:document.getElementById("snap"),
    list:document.getElementById("list"), count:document.getElementById("count") };
  document.getElementById("monthName").textContent = CP.thisMonth();

  var map = L.map("map", { zoomControl:false, scrollWheelZoom:true }).setView([38.73, -106.1], 9);
  L.control.zoom({ position:"bottomright" }).addTo(map);
  CP.basemap(map);
  var countyBounds = null;  // unfiltered view frames the whole county, not just the pins
  var countyReady = CP.countyOutline(map).then(function(line){ if(line) countyBounds = line.getBounds(); });
  var layer = L.layerGroup().addTo(map);
  var ALL = [], META = {};

  // URL <-> state, so any filtered view can be shared or bookmarked.
  function readUrl(){
    var p = new URLSearchParams(location.search);
    state.q = p.get("q") || ""; state.type = p.get("type") || ""; state.offering = p.get("offering") || "";
    state.town = p.get("town") || ""; state.open = p.get("open") === "1"; state.snap = p.get("snap") === "1";
  }
  function writeUrl(){
    var p = new URLSearchParams();
    if(state.q) p.set("q", state.q); if(state.type) p.set("type", state.type);
    if(state.offering) p.set("offering", state.offering); if(state.town) p.set("town", state.town);
    if(state.open) p.set("open","1"); if(state.snap) p.set("snap","1");
    var s = p.toString();
    history.replaceState(null, "", location.pathname + (s ? "?"+s : ""));
  }

  function chip(group, key, label, dotColor){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.key = key;
    b.innerHTML = (dotColor ? '<span class="dot" style="background:'+dotColor+'"></span>' : "") + esc(label);
    b.addEventListener("click", function(){
      state[group] = state[group] === key ? "" : key;
      sync(); apply();
    });
    return b;
  }
  function sync(){
    els.q.value = state.q; els.town.value = state.town; els.open.checked = state.open; els.snap.checked = state.snap;
    [["type",els.types],["offering",els.offerings]].forEach(function(g){
      g[1].querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c.dataset.key === state[g[0]] ? "true" : "false"); });
    });
  }

  function passes(p){
    if(p.status === "likely_closed") return false;
    if(state.type && p.types.indexOf(state.type) === -1) return false;
    if(state.offering && p.offerings.indexOf(state.offering) === -1) return false;
    if(state.town && p.town !== state.town) return false;
    if(state.open && !CP.openThisMonth(p)) return false;
    if(state.snap && !p.snap) return false;
    if(state.q){
      var hay = [p.name, p.town, p.products, p.categories.join(" "), p.notes].join(" ").toLowerCase();
      var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for(var i=0;i<words.length;i++) if(hay.indexOf(words[i]) === -1) return false;
    }
    return true;
  }

  function typeLine(p){
    return p.types.map(function(t){
      var st = CP.typeStyle(t);
      return '<span class="tag" style="color:'+st.color+'">'+st.emoji+' '+esc(META.types[t])+'</span>';
    }).join("");
  }
  function popup(p){
    return '<h4>'+esc(p.name)+'</h4><div style="margin-bottom:6px">'+typeLine(p)+'</div>'
      + (p.products ? '<div class="muted" style="font-size:.88rem">'+esc(p.products.slice(0,120))+(p.products.length>120?'…':'')+'</div>' : '')
      + '<div style="margin-top:8px;display:flex;gap:12px"><a href="'+CP.providerUrl(p)+'">Details →</a>'
      + '<a href="'+CP.directions(p)+'" target="_blank" rel="noopener">Directions</a></div>';
  }

  function apply(){
    writeUrl();
    var shown = ALL.filter(passes);
    layer.clearLayers();
    var html = shown.map(function(p){
      var sub = [p.town, p.hours ? "🕒 "+p.hours.split(";")[0] : (p.monthsOpen.length ? "📅 "+p.monthsOpen[0].slice(0,3)+"–"+p.monthsOpen[p.monthsOpen.length-1].slice(0,3) : "")].filter(Boolean).join(" · ");
      return '<a class="result" href="'+CP.providerUrl(p)+'" data-id="'+esc(p.id)+'"><strong>'+esc(p.name)+'</strong>'
        + '<div class="types">'+typeLine(p)+'</div><div class="sub">'+esc(sub)+'</div></a>';
    }).join("");
    els.list.innerHTML = html || '<p style="padding:16px" class="muted">Nothing matches those filters. <button class="chip" id="reset2">Clear filters</button></p>';
    var r2 = document.getElementById("reset2"); if(r2) r2.addEventListener("click", reset);
    var bounds = [];
    shown.forEach(function(p){
      if(p.lat == null) return;
      var icon = CP.pinIcon(state.type && p.types.indexOf(state.type) !== -1 ? state.type : CP.primaryType(p));
      var m = L.marker([p.lat, p.lng], { icon:icon, title:p.name }).bindPopup(popup(p), { maxWidth:280 });
      m.on("mouseover", function(){ hl(p.id, true); }); m.on("mouseout", function(){ hl(p.id, false); });
      m.addTo(layer); p._m = m; bounds.push([p.lat, p.lng]);
    });
    var noGeo = shown.filter(function(p){ return p.lat == null; }).length;
    els.count.textContent = shown.length + " of " + ALL.filter(function(p){ return p.status !== "likely_closed"; }).length + " places"
      + (noGeo ? " ("+noGeo+" not on map)" : "");
    var filtered = state.q || state.type || state.offering || state.town || state.open || state.snap;
    var fit = bounds.length ? L.latLngBounds(bounds) : null;
    if(!filtered && countyBounds) fit = fit ? fit.extend(countyBounds) : countyBounds;
    if(fit) map.fitBounds(fit, { padding:[24,24], maxZoom:12 });
  }
  function hl(id, on){
    var el = els.list.querySelector('[data-id="'+CSS.escape(id)+'"]');
    if(el) el.classList.toggle("hl", on);
  }
  els.list.addEventListener("mouseover", function(e){
    var a = e.target.closest(".result"); if(!a) return;
    var p = ALL.find(function(x){ return x.id === a.dataset.id; });
    if(p && p._m) p._m.openPopup();
  });
  function reset(){ state = { q:"", type:"", offering:"", town:"", open:false, snap:false }; sync(); apply(); }

  var t;
  els.q.addEventListener("input", function(){ clearTimeout(t); t = setTimeout(function(){ state.q = els.q.value.trim(); apply(); }, 150); });
  els.town.addEventListener("change", function(){ state.town = els.town.value; apply(); });
  els.open.addEventListener("change", function(){ state.open = els.open.checked; apply(); });
  els.snap.addEventListener("change", function(){ state.snap = els.snap.checked; apply(); });
  document.getElementById("reset").addEventListener("click", reset);
  document.querySelectorAll(".mobile-toggle .chip").forEach(function(b){
    b.addEventListener("click", function(){
      document.getElementById("main").dataset.view = b.dataset.view;
      document.querySelectorAll(".mobile-toggle .chip").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      if(b.dataset.view === "map") setTimeout(function(){ map.invalidateSize(); apply(); }, 50);
    });
  });

  Promise.all([CP.load("providers"), countyReady]).then(function(r){
    var d = r[0];
    ALL = d.providers; META = d.meta;
    Object.keys(META.types).forEach(function(k){
      if(ALL.some(function(p){ return p.types.indexOf(k) !== -1; }))
        els.types.appendChild(chip("type", k, CP.typeStyle(k).emoji+" "+META.types[k]));
    });
    Object.keys(META.offerings).forEach(function(k){
      if(ALL.some(function(p){ return p.offerings.indexOf(k) !== -1; }))
        els.offerings.appendChild(chip("offering", k, (CP.OFFERING_EMOJI[k]||"")+" "+META.offerings[k]));
    });
    var towns = {}; ALL.forEach(function(p){ towns[p.town] = (towns[p.town]||0) + 1; });
    Object.keys(towns).sort().forEach(function(t){
      var o = document.createElement("option"); o.value = t; o.textContent = t + " ("+towns[t]+")"; els.town.appendChild(o);
    });
    readUrl(); sync(); apply();
  }).catch(function(e){
    els.list.innerHTML = '<p style="padding:16px">Could not load the directory ('+esc(e.message)+').</p>';
  });
})();
</script>
<div id="site-footer" hidden></div>
</body>
</html>
